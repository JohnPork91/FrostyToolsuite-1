name: ImGui build check

on:
  push:
    branches: [ "imgui-rewrite" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        project: [ FrostyModManager.ImGui, FrostyEditor.ImGui ]

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build
        run: >-
          msbuild "${{ matrix.project }}/${{ matrix.project }}.csproj"
          -restore
          -p:Configuration="Release - Final"
          -p:Platform=x64
          -p:RestorePackagesConfig=true
          -maxcpucount
          -verbosity:minimal
